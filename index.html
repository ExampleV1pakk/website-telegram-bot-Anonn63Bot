<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background: #2ea6f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #1a8cd8;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест Mini App</h1>
    <p>Это тестовая страница для @Anonn63Bot</p>
    <button id="sendBtn">Отправить данные боту</button>

    <script>
        const button = document.getElementById('sendBtn');
        button.addEventListener('click', function() {
            Telegram.WebApp.sendData('Привет от Mini App!');
            Telegram.WebApp.close();
        });
        Telegram.WebApp.ready();
    </script>
</body>
</html>
